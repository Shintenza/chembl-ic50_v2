services:
  chembl-db:
    image: postgres:17
    environment:
      POSTGRES_USER:     ${CHEMBL_DB_USER}
      POSTGRES_PASSWORD: ${CHEMBL_DB_PASSWORD}
      POSTGRES_DB:       ${CHEMBL_DB_NAME}
      CHEMBL_DB_NAME:    ${CHEMBL_DB_NAME}
    ports:
      - "${CHEMBL_DB_PORT}:5432"
    volumes:
      - chembl_pg_data:/var/lib/postgresql/data
      - ./dumps:/dumps:ro
      - ./docker/init-chembl.sh:/docker-entrypoint-initdb.d/01-init-chembl.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHEMBL_DB_USER} -d ${CHEMBL_DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 120
      start_period: 60s
    shm_size: 512m

volumes:
  chembl_pg_data:
